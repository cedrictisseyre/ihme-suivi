# Infrastructure partagée, administrée par l’enseignant uniquement.
services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: platform_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?}
      POSTGRES_DB: postgres
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=120", "-c", "password_encryption=scram-sha-256"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    networks:
      database:
        aliases: [postgres]
    mem_limit: 384m
    shm_size: 128m
    pids_limit: 180
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_admin -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ${CADDY_CONFIG_PATH:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - /run/ihme-deploy:/run/ihme-deploy:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [web]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 100
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
networks:
  database:
    external: true
    name: ${DB_NETWORK:-ihme-database}
  web:
    external: true
    name: ${PROXY_NETWORK:-ihme-web}
volumes:
  postgres-data:
  caddy-data:
  caddy-config:
