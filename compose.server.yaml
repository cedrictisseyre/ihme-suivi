# PostgreSQL partagé et reverse proxy HTTPS déjà administrés sur Docker Engine.
x-app: &app
  image: ${APP_IMAGE:?Définir une image immuable}
  env_file: .env.server
  environment:
    APP_VERSION: ${APP_VERSION:-local}
  networks: [database]
  read_only: true
  tmpfs: ["/tmp"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  init: true
services:
  migrate:
    <<: *app
    command: ["node", "server/migrate.js"]
    restart: "no"
    mem_limit: 192m
    pids_limit: 100
  app:
    <<: *app
    restart: unless-stopped
    networks:
      database: {}
      web:
        aliases: [ihme-app]
    mem_limit: 256m
    pids_limit: 128
    cpus: 1.0
    expose: ["3000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
networks:
  database:
    external: true
    name: ${DB_NETWORK:?}
  web:
    external: true
    name: ${PROXY_NETWORK:?}
